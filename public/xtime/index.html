<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed Topics</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>For You feed</h1>
    <form class="people-search" id="peopleSearch" role="search" autocomplete="off">
      <input type="search" id="peopleInput" placeholder="Search people" aria-label="Search people"
             aria-controls="peopleMenu" aria-expanded="false" />
      <div class="people-menu" id="peopleMenu" role="listbox" hidden></div>
    </form>
    <div class="controls">
      <div class="view-toggle" id="viewToggle" role="tablist">
        <button type="button" class="view-tab active" data-view="topics" role="tab" aria-selected="true">Topics</button>
        <button type="button" class="view-tab" data-view="nouns" role="tab" aria-selected="false">Nouns</button>
      </div>
      <select id="batch" title="Scrape batch" aria-label="Scrape batch"></select>
      <label class="noise-toggle">
        <input type="checkbox" id="noise" />
        Show noise
      </label>
      <button id="scrape" class="btn btn-primary">Scrape</button>
      <button id="reclassify" class="btn">Reclassify</button>
      <details class="labs" id="labs">
        <summary class="btn" title="Experimental features">Labs</summary>
        <div class="labs-menu">
          <div class="labs-title">Experimental</div>
          <label class="labs-item">
            <input type="checkbox" id="labRecommend" disabled />
            <span>
              <b>Tweet recommendations</b>
              <small>Opening a tweet adds a sidebar of 4–5 related tweets. The LLM writes three searches from the tweet and its replies, then picks the best results. Uses LLM calls for every tweet you open.</small>
            </span>
          </label>
        </div>
      </details>
    </div>
  </header>

  <div id="statusBar" class="statusbar" hidden></div>

  <main>
    <section class="stats" id="stats"></section>
    <section class="topic-list" id="topicList"></section>
    <section class="noun-list" id="nounList" hidden></section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <dialog id="scrapeModal" class="scrape-modal">
    <form method="dialog">
      <h2>No batch today</h2>
      <p>No tweets have been scraped yet today. Run a scrape now?</p>
      <div class="modal-actions">
        <button type="submit" value="cancel" class="btn">Not now</button>
        <button type="submit" value="scrape" class="btn btn-primary">Scrape now</button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
